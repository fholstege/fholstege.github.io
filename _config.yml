title: Floris Holstege
description: personal description
url: https://fholstege.github.io
baseurl: ""
repository: fholstege/fholstege.github.io
timezone: America/Los_Angeles
future: true

author:
  name: Floris Holstege
  email: f.g.holstege@uva.nl

# The homepage fetches this file as Markdown.
include:
  - about.md
exclude:
  - AGENTS.MD
  - illustrations
  - local
  - tests

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo

collections:
  writing:
    output: true
    permalink: /:collection/:path/

defaults:
  - scope:
      path: ""
      type: writing
    values:
      layout: post
      use_math: true

plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from
whitelist:
  - jekyll-sitemap
  - jekyll-feed
